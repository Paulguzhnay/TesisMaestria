version: '3.8'

services:
  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-proxy-odoo
    ports:
      - "80:80"
    networks:
      - odoo_network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

networks:
  odoo_network:
    external: true
