<div class="shell-wrapper">
  <div class="shell-container">
    <div class="terminal-header">
      <h2>Logs de la instancia</h2>
    </div>

  <div class="shell-container">
    <div class="terminal-header">
      <h2>Logs de instancias Odoo</h2>
    </div>

    <div class="terminal-box">
      <div class="terminal"></div>
    </div>

    <p *ngIf="!selectedContainer" class="empty-msg">
      🔍 Selecciona una instancia para visualizar los logs.
    </p>
    <p *ngIf="loadingLogs" class="loading-msg">
      ⏳ Cargando logs... por favor espera.
    </p>
  </div>
</div>
