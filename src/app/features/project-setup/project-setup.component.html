<div class="setup-wrapper">
    <h2>Deploy Your Platform</h2>
  
    <form [formGroup]="projectForm" (ngSubmit)="deploy()">
      <div class="form-group">
        <label>GitHub Repository:</label><br />
        <label><input type="radio" formControlName="repositoryType" value="new" /> Nuevo Repositorio</label>
        <label><input type="radio" formControlName="repositoryType" value="existing" /> Repositorio Existente</label>
      </div>
  
      <div class="form-group">
        <input formControlName="repository" type="text" placeholder="Organization/repo" />
      </div>
  
      <div class="form-group">
        <label>Version de Odoo:</label>
        <select formControlName="odooVersion">
          <option *ngFor="let version of odooVersions" [value]="version">{{ version }}</option>
        </select>
      </div>
  
  

  
      <button type="submit" class="deploy-btn">Iniciar</button>
    </form>
  </div>
