<h2>Importar Base de Datos / Filestore</h2>

<form (ngSubmit)="importDatabase()" #form="ngForm">
  <!-- Instancia seleccionada -->
  <div style="margin-bottom: 16px;">
    <strong>Instancia Seleccionada:</strong>
    <span *ngIf="selectedInstance">{{ selectedInstance.name }} ({{ selectedInstance.category }})</span>
    <span *ngIf="!selectedInstance">Cargando...</span>
  </div>

  <!-- Selector de archivos -->
  <input type="file" multiple (change)="onFilesSelected($event)" accept=".dump,.tar.gz" />

  <!-- Botón para importar -->
  <button mat-raised-button color="primary" type="submit"
          [disabled]="!selectedDbFile || !selectedInstance">
    Importar
  </button>
</form>
