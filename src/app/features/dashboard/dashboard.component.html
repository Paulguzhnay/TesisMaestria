<div class="dashboard-wrapper">
  <!-- Barra superior -->
  <div class="header-bar">
    <h1 class="title">Mis Proyectos</h1>
    <div class="user-actions">
      <div class="user-info" *ngIf="username">
        <img [src]="avatarUrl" width="32" height="32" class="avatar" />
        <span class="username">{{ username }}</span>
      </div>
      <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>

  <!-- Botón crear -->
  <div class="create-container">
    <button class="create-btn" (click)="openCreateDialog()">+ Crear nuevo proyecto</button>
  </div>

  <!-- Lista de proyectos -->
  <div class="project-grid">
    <div class="project-card" *ngFor="let project of projects">
      <h3>{{ project.name }}</h3>

      <div class="card-actions">
        <button class="open-btn" (click)="abrirProyecto(project)">Abrir</button>
        <button class="delete-btn" *ngIf="project.id !== undefined" (click)="deleteProject(project)">
          Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
