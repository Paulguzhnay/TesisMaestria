<div class="shell-container">

  <!-- Selector de instancia -->
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Selecciona una instancia</mat-label>
    <mat-select [(ngModel)]="selectedInstance">
      <mat-option *ngFor="let inst of instances" [value]="inst">
        {{ inst.name }} ({{ inst.category }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Campo de texto para comando SQL -->
  <mat-form-field class="full-width">
    <mat-label>Comando SQL</mat-label>
    <textarea matInput [(ngModel)]="command" placeholder="Ej: SELECT * FROM odoo_instances;"></textarea>
  </mat-form-field>

  <!-- Botón de ejecutar -->
  <button mat-raised-button color="primary" (click)="executeCommand()"
          [disabled]="isLoading || !command.trim() || !selectedInstance">
    ▶ Ejecutar Comando
  </button>

  <mat-divider style="margin: 20px 0;"></mat-divider>

  <!-- Indicador de carga -->
  <div *ngIf="isLoading" style="text-align: center; margin-bottom: 10px;">
    <mat-spinner diameter="30"></mat-spinner>
    <p>Ejecutando comando...</p>
  </div>

  <!-- Resultado -->
<!-- Resultado -->
<div *ngIf="!isLoading && result">
  <h3>🧾 Resultado:</h3>

  <!-- Tabla si hay datos parseados -->
  <table *ngIf="csvRows.length > 0" class="result-table">
    <tr *ngFor="let row of csvRows">
      <td *ngFor="let cell of row">{{ cell || '-' }}</td>
    </tr>
  </table>

  <!-- Fallback si la salida no es CSV -->
  <pre *ngIf="csvRows.length === 0" [ngClass]="{ 'error-output': result.startsWith('❌') }">{{ result }}</pre>
</div>
</div>
