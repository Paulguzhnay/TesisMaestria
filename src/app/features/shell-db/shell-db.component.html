<div class="shell-container">
  <mat-form-field class="full-width">
    <mat-label>Comando SQL</mat-label>
    <textarea matInput [(ngModel)]="command" placeholder="Ej: SELECT * FROM res_users;"></textarea>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="executeCommand()" [disabled]="isLoading || !command.trim()">
    ▶ Ejecutar Comando
  </button>

  <mat-divider style="margin: 20px 0;"></mat-divider>

  <div *ngIf="isLoading" style="text-align: center; margin-bottom: 10px;">
    <mat-spinner diameter="30"></mat-spinner>
    <p>Ejecutando comando...</p>
  </div>

  <div *ngIf="!isLoading && result">
    <h3>🧾 Resultado:</h3>

    <table *ngIf="csvRows.length > 0" class="result-table">
      <tr *ngFor="let row of csvRows">
        <td *ngFor="let cell of row">{{ cell || '-' }}</td>
      </tr>
    </table>

    <pre *ngIf="csvRows.length === 0" [ngClass]="{ 'error-output': result.startsWith('❌') }">{{ result }}</pre>
  </div>
</div>
