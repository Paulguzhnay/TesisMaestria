<h2>Ramas de GitHub</h2>
<ul>
  <li *ngFor="let branch of branches" (click)="onSelectBranch(branch)">
    {{ branch }}
  </li>
</ul>

<h2>Commits recientes</h2>
<!-- Mostrar la rama seleccionada -->
<p *ngIf="selectedBranch">Rama seleccionada: {{ selectedBranch }}</p>

<ul>
  <li *ngFor="let commit of commits">
    {{ commit }}
  </li>
</ul>
