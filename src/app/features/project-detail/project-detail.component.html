<div class="detail-wrapper">
    <h2>Proyecto: {{ projectName }}</h2>
  
    <div *ngIf="loading">Cargando instancias...</div>
    <div *ngIf="error">{{ error }}</div>
  
    <div class="instances-grid" *ngIf="!loading && !error">
      <div *ngFor="let inst of instances" class="instance-card">
        <h3>{{ inst.name }}</h3>
        <p>Estado: {{ inst.status }}</p>
        <p>Versión: {{ inst.version }}</p>
        <p><a [href]="inst.url" target="_blank">Abrir</a></p>
      </div>
    </div>
  </div>
