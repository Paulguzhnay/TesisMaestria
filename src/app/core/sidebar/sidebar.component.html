<div class="sidebar">
    <input type="text" placeholder="Filter branches..." />
  
    <div class="category">
      <span>PRODUCTION</span>
      <div *ngFor="let branch of branches" class="branch" [ngClass]="branch.status">
        {{ branch.name }}
      </div>
      <button (click)="addOdooInstance()">+</button>
    </div>
  
    <div class="category">
      <span>STAGING</span>
      <div *ngFor="let branch of branches" class="branch" [ngClass]="branch.status">
        {{ branch.name }}
      </div>
      <button (click)="addOdooInstance()">+</button>
    </div>

    <div class="category">
        <span>DEVELOPMENT</span>
        <div *ngFor="let branch of branches" class="branch" [ngClass]="branch.status">
          {{ branch.name }}
        </div>
        <button (click)="addOdooInstance()">+</button>
      </div>
  </div>
