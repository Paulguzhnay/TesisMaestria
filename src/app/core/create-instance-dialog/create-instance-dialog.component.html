<h2 mat-dialog-title>Crear Instancia</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Nombre -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="p.ej. mi-proyecto-dev" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">Nombre obligatorio</mat-error>
    </mat-form-field>

    <!-- Categoría (bloqueado) -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Categoría</mat-label>
      <input matInput [value]="currentCategory" disabled />
    </mat-form-field>

    <!-- Código fuente desde -->
    <mat-form-field *ngIf="getValidSourceCategories().length > 0" appearance="outline" class="full-width">
      <mat-label>Copiar código desde</mat-label>
      <mat-select formControlName="codeSourceCategory">
        <mat-option *ngFor="let option of getValidSourceCategories()" [value]="option">{{ option }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Neutralize (solo STAGING) -->
    <mat-checkbox *ngIf="currentCategory === 'STAGING'" formControlName="neutralize">
      <strong>Neutralize</strong>
    </mat-checkbox>

    <!-- Copiar datos desde producción (solo STAGING) -->
    <mat-checkbox *ngIf="currentCategory === 'STAGING'" formControlName="copyDataFromProduction">
      Copiar datos desde producción
    </mat-checkbox>


    <!-- Spinner -->
    <div *ngIf="isProcessing" style="text-align: center; margin-bottom: 10px;">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Creando instancia...</p>
    </div>

    <mat-dialog-actions align="end">
      <button mat-button (click)="cancel()" [disabled]="isProcessing">Cancelar</button>
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="isProcessing">Crear</button>
    </mat-dialog-actions>
