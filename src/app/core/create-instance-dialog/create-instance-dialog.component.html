<h2 mat-dialog-title>Crear Instancia</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="p.ej. mi-proyecto-dev" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">Nombre obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Categoría</mat-label>
      <input matInput [value]="categoryValue" disabled />
    </mat-form-field>

    <!-- Checkbox solo para STAGING -->
    <mat-checkbox *ngIf="categoryValue === 'STAGING'" formControlName="neutralize" style="margin-top: 12px;">
      <strong>neutralize</strong>
    </mat-checkbox>

  </form>
</mat-dialog-content>
<div *ngIf="isProcessing" style="text-align: center; margin-bottom: 10px;">
  <mat-spinner diameter="40"></mat-spinner>
  <p>Creando instancia...</p>
</div>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="isProcessing">Cancelar</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="isProcessing">
    Crear
  </button>
</mat-dialog-actions>

<div class="overlay-spinner" *ngIf="isProcessing">
  <mat-spinner diameter="60" color="accent"></mat-spinner>
</div>
